<!DOCTYPE html>
<html>
<head>
    <title>Studio Test</title>
</head>
<body>
    <h1>Studio Test Page</h1>
    <div id="test-result">
        <p>DEBUG: {{ debug }}</p>
        <p>Vite URL: http://localhost:3000/src/main.tsx</p>
    </div>
    
    <script>
        console.log('Test script loaded');
        // Пробуем загрузить Vite
        const script = document.createElement('script');
        script.src = 'http://localhost:3000/src/main.tsx';
        script.type = 'module';
        script.onload = () => console.log('Vite script loaded OK');
        script.onerror = (e) => console.error('Vite script error:', e);
        document.body.appendChild(script);
    </script>
</body>
</html>
