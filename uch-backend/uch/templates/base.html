<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Universal Creative Hub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<!-- В base.html в <head> после загрузки стилей: -->
    <script>
        console.log('🔄 Проверка загрузки CSS...');
        console.log('CSS файл:', "{% static 'css/style.css' %}");
        </script>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">UCH v0.3</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Основной контент -->
            <div class="col-md-8">
                {% block content %}{% endblock %}
            </div>
            <!-- Боковая панель -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        Боковая панель
                    </div>
                    <div class="card-body">
                        <p>Это тестовая боковая панель. Она должна отображаться.</p>
                        <ul>
                            <li>Категория 1</li>
                            <li>Категория 2</li>
                            <li>Категория 3</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
